on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches:
      - "main"
      - "develop"
      - "feature/**"
      - "task-**"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install yamllint

      - name: Lint (black)
        run: |
          if [ -d "src" ]; then
            black --check src
          fi
          if [ -d "tests" ]; then
            black --check tests
          fi

      - name: Lint (flake8)
        run: |
          if [ -d "src" ]; then
            black --check src
          fi
          if [ -d "tests" ]; then
            black --check tests
          fi